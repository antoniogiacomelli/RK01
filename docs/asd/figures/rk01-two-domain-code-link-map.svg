<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
  <title id="title">RK01 two-domain source syntax, linker placement and MPU policy</title>
  <desc id="desc">Side-by-side view of two RK01 domain declarations, the linker sections that place them, and the runtime MPU policy derived from BOOT validation.</desc>
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .heading { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b53; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #243b53; }
      .monoStrong { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #102a43; }
      .panel { fill: #ffffff; stroke: #829ab1; stroke-width: 1.6; }
      .subtle { fill: #f7fafc; stroke: #d9e2ec; stroke-width: 1.2; }
      .code { fill: #f6fbff; stroke: #2f80a7; stroke-width: 1.4; }
      .link { fill: #fff8ec; stroke: #b26a00; stroke-width: 1.4; }
      .map { fill: #f3fbf7; stroke: #2f855a; stroke-width: 1.4; }
      .mpu { fill: #f8f5ff; stroke: #6b46c1; stroke-width: 1.4; }
      .domainA { fill: #dff3fb; stroke: #2f80a7; stroke-width: 1.4; }
      .domainB { fill: #e7f7df; stroke: #4f7b42; stroke-width: 1.4; }
      .stack { fill: #fdebd3; stroke: #b26a00; stroke-width: 1.2; }
      .shared { fill: #fce8ee; stroke: #b83280; stroke-width: 1.2; }
      .flash { fill: #edf2f7; stroke: #627d98; stroke-width: 1.2; }
      .arrow { stroke: #829ab1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9fb3c8; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#829ab1"/>
    </marker>
  </defs>

  <rect width="1320" height="780" fill="#ffffff"/>
  <text x="660" y="42" text-anchor="middle" class="title">Two domains: source syntax, linker sections, final map</text>

  <rect x="30" y="72" width="390" height="650" rx="8" class="panel"/>
  <text x="225" y="105" text-anchor="middle" class="heading">1. C source declarations</text>
  <rect x="52" y="128" width="346" height="255" rx="6" class="code"/>
  <text x="72" y="158" class="monoStrong">/* domains.c */</text>
  <text x="72" y="184" class="mono">#define SENSOR_BYTES  256U</text>
  <text x="72" y="206" class="mono">#define CONTROL_BYTES 512U</text>
  <text x="72" y="236" class="mono">RK_DECLARE_DOMAIN(sensorDomain,</text>
  <text x="72" y="256" class="mono">                  sensorRam,</text>
  <text x="72" y="276" class="mono">                  SENSOR_BYTES)</text>
  <text x="72" y="306" class="mono">RK_DECLARE_DOMAIN(controlDomain,</text>
  <text x="72" y="326" class="mono">                  controlRam,</text>
  <text x="72" y="346" class="mono">                  CONTROL_BYTES)</text>
  <text x="72" y="370" class="small">Each RAM object is emitted to .rk_domain_ram.</text>

  <rect x="52" y="402" width="346" height="150" rx="6" class="subtle"/>
  <text x="72" y="432" class="mono">RK_DECLARE_DOMAIN_TASK(sensorTask)</text>
  <text x="72" y="454" class="mono">RK_DECLARE_DOMAIN_TASK(controlTask)</text>
  <text x="72" y="486" class="mono">RK_DECLARE_DOMAIN_TASK_STACK(</text>
  <text x="72" y="506" class="mono">    sensorStack, 128U)</text>
  <text x="72" y="530" class="small">Stacks are emitted to .rk_task_stack.</text>

  <rect x="52" y="574" width="346" height="118" rx="6" class="subtle"/>
  <text x="72" y="604" class="mono">SensorBus sharedBus</text>
  <text x="72" y="624" class="mono">    K_ALIGN(4) RK_SHARED_RAM_ATTR;</text>
  <text x="72" y="654" class="mono">kTaskInitDomain(..., &amp;sensorDomain);</text>
  <text x="72" y="676" class="mono">kTaskInitDomain(..., &amp;controlDomain);</text>

  <rect x="465" y="72" width="390" height="650" rx="8" class="panel"/>
  <text x="660" y="105" text-anchor="middle" class="heading">2. Linker placement</text>
  <rect x="487" y="128" width="346" height="247" rx="6" class="link"/>
  <text x="507" y="158" class="monoStrong">/* arch/.../linker.ld */</text>
  <text x="507" y="184" class="mono">.rk_domain_ram (NOLOAD) :</text>
  <text x="507" y="206" class="mono">{</text>
  <text x="527" y="228" class="mono">__rk_domain_ram_begin = .;</text>
  <text x="527" y="250" class="mono">KEEP(*(.rk_domain_ram*))</text>
  <text x="527" y="272" class="mono">__rk_domain_ram_end = .;</text>
  <text x="507" y="294" class="mono">} &gt; TASK_RAM</text>
  <text x="507" y="326" class="mono">.rk_task_stack (NOLOAD) :</text>
  <text x="527" y="348" class="mono">KEEP(*(.rk_task_stack*))</text>

  <rect x="487" y="396" width="346" height="296" rx="6" class="map"/>
  <text x="507" y="426" class="monoStrong">/* rk01_demo.map excerpt */</text>
  <text x="507" y="456" class="mono">.rk_domain_ram  0x20004000</text>
  <text x="527" y="480" class="mono">sensorRam       0x00000100</text>
  <text x="527" y="502" class="mono">controlRam      0x00000200</text>
  <text x="507" y="536" class="mono">.rk_task_stack  0x20005000</text>
  <text x="527" y="560" class="mono">sensorStack     0x00000200</text>
  <text x="527" y="582" class="mono">controlStack    0x00000200</text>
  <text x="507" y="616" class="mono">.rk_shared_bss  0x20006000</text>
  <text x="527" y="640" class="mono">sharedBus       sizeof(...)</text>
  <text x="507" y="672" class="small">Addresses are illustrative; section membership is the audit point.</text>

  <rect x="900" y="72" width="390" height="650" rx="8" class="panel"/>
  <text x="1095" y="105" text-anchor="middle" class="heading">3. MPU access policy</text>

  <rect x="928" y="132" width="334" height="80" rx="6" class="flash"/>
  <text x="1095" y="164" text-anchor="middle" class="label">FLASH code and const data</text>
  <text x="1095" y="188" text-anchor="middle" class="small">Both tasks execute the same linked image.</text>

  <rect x="928" y="242" width="334" height="174" rx="6" class="mpu"/>
  <text x="1095" y="274" text-anchor="middle" class="label">When sensorTask runs</text>
  <rect x="956" y="296" width="126" height="38" rx="4" class="domainA"/>
  <text x="1019" y="320" text-anchor="middle" class="small">sensorRam</text>
  <rect x="956" y="348" width="126" height="38" rx="4" class="stack"/>
  <text x="1019" y="372" text-anchor="middle" class="small">sensorStack</text>
  <rect x="1104" y="296" width="126" height="90" rx="4" class="shared"/>
  <text x="1167" y="342" text-anchor="middle" class="small">sharedBus</text>
  <path d="M 1092 314 L 1100 314" class="dash"/>
  <text x="1095" y="404" text-anchor="middle" class="small">controlRam is not writable in this view.</text>

  <rect x="928" y="448" width="334" height="174" rx="6" class="mpu"/>
  <text x="1095" y="480" text-anchor="middle" class="label">When controlTask runs</text>
  <rect x="956" y="502" width="126" height="38" rx="4" class="domainB"/>
  <text x="1019" y="526" text-anchor="middle" class="small">controlRam</text>
  <rect x="956" y="554" width="126" height="38" rx="4" class="stack"/>
  <text x="1019" y="578" text-anchor="middle" class="small">controlStack</text>
  <rect x="1104" y="502" width="126" height="90" rx="4" class="shared"/>
  <text x="1167" y="548" text-anchor="middle" class="small">sharedBus</text>
  <path d="M 1092 520 L 1100 520" class="dash"/>
  <text x="1095" y="610" text-anchor="middle" class="small">sensorRam is not writable in this view.</text>

  <path d="M 420 345 C 442 345 442 345 465 345" class="arrow"/>
  <path d="M 855 345 C 878 345 878 345 900 345" class="arrow"/>
  <path d="M 855 548 C 878 548 878 548 900 548" class="arrow"/>

  <text x="660" y="752" text-anchor="middle" class="small">The source names help humans review ownership; linked sections provide ranges; BOOT validation and MPU setup apply policy.</text>
</svg>
