<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">RK01 build-time memory organisation on STM32F401RE</title>
  <desc id="desc">The linker separates two flash regions from task and kernel SRAM. Task RAM contains the implicit application domain, explicit domain windows, private stacks, no-init storage, and shared apertures. Kernel RAM contains privileged kernel state and stacks.</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b53; }
      .mono { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #486581; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .frame { fill: #ffffff; stroke: #829ab1; stroke-width: 2; }
      .flash { fill: #e8f3f8; stroke: #1f5f87; stroke-width: 2; }
      .fs { fill: #e9f7f5; stroke: #147d86; stroke-width: 2; }
      .task { fill: #eef7ea; stroke: #4f7b42; stroke-width: 2; }
      .kernel { fill: #fceceb; stroke: #a23b3b; stroke-width: 2; }
      .rule { stroke: #b8c7d1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Build-time memory organisation — STM32F401RE</text>

  <rect x="50" y="82" width="520" height="520" rx="10" class="frame"/>
  <text x="310" y="118" text-anchor="middle" class="heading">FLASH address space</text>
  <text x="76" y="154" class="mono">0x08080000</text>

  <rect x="76" y="170" width="468" height="170" rx="8" class="fs"/>
  <text x="310" y="206" text-anchor="middle" class="label">FS_FLASH — 256 KiB</text>
  <text x="310" y="235" text-anchor="middle" class="mono">0x08040000–0x0807FFFF</text>
  <line x1="106" y1="257" x2="514" y2="257" class="rule"/>
  <text x="310" y="287" text-anchor="middle" class="body">RKFS storage</text>
  <text x="310" y="313" text-anchor="middle" class="small">Not ordinary user executable space</text>

  <rect x="76" y="354" width="468" height="210" rx="8" class="flash"/>
  <text x="310" y="392" text-anchor="middle" class="label">FLASH — 256 KiB</text>
  <text x="310" y="421" text-anchor="middle" class="mono">0x08000000–0x0803FFFF</text>
  <line x1="106" y1="443" x2="514" y2="443" class="rule"/>
  <text x="310" y="478" text-anchor="middle" class="body">Vector table and shared executable code</text>
  <text x="310" y="507" text-anchor="middle" class="body">Read-only data</text>
  <text x="76" y="590" class="mono">0x08000000</text>

  <rect x="630" y="82" width="520" height="520" rx="10" class="frame"/>
  <text x="890" y="118" text-anchor="middle" class="heading">SRAM address space</text>
  <text x="656" y="154" class="mono">0x20018000</text>

  <rect x="656" y="170" width="468" height="145" rx="8" class="kernel"/>
  <text x="890" y="204" text-anchor="middle" class="label">KERNEL_RAM — 32 KiB</text>
  <text x="890" y="232" text-anchor="middle" class="mono">0x20010000–0x20017FFF</text>
  <text x="890" y="263" text-anchor="middle" class="body">Kernel data, pools, registries, MSP</text>
  <text x="890" y="289" text-anchor="middle" class="small">Privileged state and stacks</text>

  <rect x="656" y="329" width="468" height="235" rx="8" class="task"/>
  <text x="890" y="363" text-anchor="middle" class="label">TASK_RAM — 64 KiB</text>
  <text x="890" y="391" text-anchor="middle" class="mono">0x20000000–0x2000FFFF</text>
  <line x1="686" y1="411" x2="1094" y2="411" class="rule"/>
  <text x="696" y="441" class="body">• Implicit App-domain window (16 KiB)</text>
  <text x="696" y="471" class="body">• Explicit domain windows</text>
  <text x="696" y="501" class="body">• Private task stacks and task no-init</text>
  <text x="696" y="531" class="body">• Global and explicit shared apertures</text>
  <text x="656" y="590" class="mono">0x20000000</text>

  <text x="600" y="638" text-anchor="middle" class="small">Descriptive layout; blocks are not drawn to scale.</text>
</svg>
