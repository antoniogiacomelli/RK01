<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RK0 and RK01 preemption-chain benchmark</title>
  <desc id="desc">After 150 seconds RK0 reached a mean worker count of 5,353,331 while RK01 reached 1,424,977.4, or 26.62 percent of RK0 throughput. RK01 maximum counter delta at five 30-second samples was zero, one, zero, one, one, with no errors.</desc>

  <rect width="1200" height="720" rx="24" fill="#F5F8FA"/>
  <rect x="1" y="1" width="1198" height="718" rx="23" fill="none" stroke="#C9D6DF" stroke-width="2"/>

  <text x="56" y="64" fill="#10283F" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Preemption-chain throughput</text>
  <text x="56" y="96" fill="#526879" font-family="Arial, Helvetica, sans-serif" font-size="17">Cortex-M4F at 80 MHz · Nucleo STM32F401RE · -O2 · FPU context disabled · 150 s</text>

  <rect x="894" y="38" width="250" height="78" rx="12" fill="#10283F"/>
  <text x="1019" y="66" text-anchor="middle" fill="#CFEAE8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">RK01 CHAIN COST</text>
  <text x="1019" y="99" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">3.7568× RK0</text>

  <text x="56" y="158" fill="#10283F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Mean worker count after 150 seconds</text>
  <text x="1144" y="158" text-anchor="end" fill="#526879" font-family="Arial, Helvetica, sans-serif" font-size="14">Higher is faster</text>

  <g stroke="#D8E2E8" stroke-width="1">
    <line x1="250" y1="184" x2="250" y2="382"/>
    <line x1="414" y1="184" x2="414" y2="382"/>
    <line x1="578" y1="184" x2="578" y2="382"/>
    <line x1="742" y1="184" x2="742" y2="382"/>
    <line x1="906" y1="184" x2="906" y2="382"/>
    <line x1="1070" y1="184" x2="1070" y2="382"/>
  </g>

  <g fill="#687C8B" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <text x="250" y="405" text-anchor="middle">0</text>
    <text x="414" y="405" text-anchor="middle">1M</text>
    <text x="578" y="405" text-anchor="middle">2M</text>
    <text x="742" y="405" text-anchor="middle">3M</text>
    <text x="906" y="405" text-anchor="middle">4M</text>
    <text x="1070" y="405" text-anchor="middle">5M</text>
  </g>

  <text x="56" y="229" fill="#10283F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">RK0</text>
  <rect x="250" y="196" width="878" height="48" rx="8" fill="#31516B"/>
  <text x="1110" y="227" text-anchor="end" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">5,353,331.0</text>
  <text x="250" y="266" fill="#526879" font-family="Arial, Helvetica, sans-serif" font-size="15">35,688.9 complete chains/s · 100% relative throughput</text>

  <text x="56" y="329" fill="#10283F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">RK01</text>
  <rect x="250" y="296" width="234" height="48" rx="8" fill="#168A86"/>
  <text x="500" y="327" fill="#10283F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">1,424,977.4</text>
  <text x="250" y="366" fill="#526879" font-family="Arial, Helvetica, sans-serif" font-size="15">9,499.8 complete chains/s · 26.62% relative throughput</text>

  <rect x="56" y="448" width="1088" height="184" rx="16" fill="#FFFFFF" stroke="#D8E2E8"/>
  <text x="84" y="486" fill="#10283F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RK01 counter phase at each 30-second report</text>
  <text x="1116" y="486" text-anchor="end" fill="#168A86" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">errors = 0 throughout</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(203 0)">
      <text x="0" y="526" fill="#687C8B" font-size="13">30 s</text>
      <circle cx="0" cy="565" r="25" fill="#E2F1EF" stroke="#168A86" stroke-width="2"/>
      <text x="0" y="572" fill="#10283F" font-size="20" font-weight="700">0</text>
    </g>
    <g transform="translate(401 0)">
      <text x="0" y="526" fill="#687C8B" font-size="13">60 s</text>
      <circle cx="0" cy="565" r="25" fill="#E2F1EF" stroke="#168A86" stroke-width="2"/>
      <text x="0" y="572" fill="#10283F" font-size="20" font-weight="700">1</text>
    </g>
    <g transform="translate(599 0)">
      <text x="0" y="526" fill="#687C8B" font-size="13">90 s</text>
      <circle cx="0" cy="565" r="25" fill="#E2F1EF" stroke="#168A86" stroke-width="2"/>
      <text x="0" y="572" fill="#10283F" font-size="20" font-weight="700">0</text>
    </g>
    <g transform="translate(797 0)">
      <text x="0" y="526" fill="#687C8B" font-size="13">120 s</text>
      <circle cx="0" cy="565" r="25" fill="#E2F1EF" stroke="#168A86" stroke-width="2"/>
      <text x="0" y="572" fill="#10283F" font-size="20" font-weight="700">1</text>
    </g>
    <g transform="translate(995 0)">
      <text x="0" y="526" fill="#687C8B" font-size="13">150 s</text>
      <circle cx="0" cy="565" r="25" fill="#E2F1EF" stroke="#168A86" stroke-width="2"/>
      <text x="0" y="572" fill="#10283F" font-size="20" font-weight="700">1</text>
    </g>
  </g>

  <text x="84" y="611" fill="#526879" font-family="Arial, Helvetica, sans-serif" font-size="14">max_delta: maximum distance from the logged integer average. Acceptance limit: ±1.</text>
  <text x="56" y="678" fill="#526879" font-family="Arial, Helvetica, sans-serif" font-size="14">This is an end-to-end event, syscall, scheduling, context-switch and MPU benchmark - not an isolated PendSV latency measurement.</text>
</svg>
