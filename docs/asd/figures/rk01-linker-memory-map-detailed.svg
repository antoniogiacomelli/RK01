<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">RK01 detailed linker memory map for STM32F401RE</title>
  <desc id="desc">Detailed diagram of the RK01 linker memory map showing FLASH, FS_FLASH, TASK_RAM, KERNEL_RAM, section order, exported boundary symbols, and RAM load-copy relationships.</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b53; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #243b53; }
      .monoSmall { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #486581; }
      .frame { fill: #ffffff; stroke: #829ab1; stroke-width: 1.6; }
      .flash { fill: #e8f3f8; stroke: #1f5f87; stroke-width: 1.4; }
      .fs { fill: #e9f7f5; stroke: #147d86; stroke-width: 1.4; }
      .task { fill: #eef7ea; stroke: #4f7b42; stroke-width: 1.4; }
      .app { fill: #dff3fb; stroke: #2f80a7; stroke-width: 1.2; }
      .domain { fill: #f0f9df; stroke: #4f7b42; stroke-width: 1.2; }
      .stack { fill: #fff4d6; stroke: #b26a00; stroke-width: 1.2; }
      .shared { fill: #fde8ef; stroke: #b83280; stroke-width: 1.2; }
      .kernel { fill: #fceceb; stroke: #a23b3b; stroke-width: 1.4; }
      .kdata { fill: #ffe3e3; stroke: #a23b3b; stroke-width: 1.2; }
      .heap { fill: #f8f5ff; stroke: #6b46c1; stroke-width: 1.2; }
      .discard { fill: #f7fafc; stroke: #9fb3c8; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .rule { stroke: #b8c7d1; stroke-width: 1.2; }
      .arrow { stroke: #627d98; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .copy { stroke: #b83280; stroke-width: 2; fill: none; marker-end: url(#arrowPink); stroke-dasharray: 7 5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#627d98"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b83280"/>
    </marker>
  </defs>

  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="title">RK01 linker memory map - STM32F401RE</text>
  <text x="750" y="70" text-anchor="middle" class="small">One final image; sections provide addresses and bounds, while BOOT membership and MPU dispatch apply unprivileged access policy.</text>

  <rect x="50" y="110" width="400" height="760" rx="8" class="frame"/>
  <text x="250" y="144" text-anchor="middle" class="heading">FLASH address space</text>
  <text x="78" y="174" class="mono">__rk_flash_begin = 0x08000000</text>
  <text x="78" y="194" class="mono">__rk_fs_flash_end = 0x08080000</text>

  <rect x="82" y="220" width="336" height="278" rx="6" class="fs"/>
  <text x="250" y="250" text-anchor="middle" class="label">FS_FLASH (rx) - 256 KiB</text>
  <text x="250" y="272" text-anchor="middle" class="mono">0x08040000..0x0807FFFF</text>
  <line x1="108" y1="292" x2="392" y2="292" class="rule"/>
  <text x="250" y="322" text-anchor="middle" class="body">reserved filesystem flash</text>
  <text x="250" y="344" text-anchor="middle" class="small">__rk_fs_flash_begin / __rk_fs_flash_end</text>

  <rect x="82" y="528" width="336" height="278" rx="6" class="flash"/>
  <text x="250" y="558" text-anchor="middle" class="label">FLASH (rx) - 256 KiB</text>
  <text x="250" y="580" text-anchor="middle" class="mono">0x08000000..0x0803FFFF</text>
  <line x1="108" y1="602" x2="392" y2="602" class="rule"/>
  <text x="108" y="630" class="mono">.text</text>
  <text x="130" y="652" class="monoSmall">KEEP(*(.isr_vector))</text>
  <text x="130" y="672" class="monoSmall">*(.text*)</text>
  <text x="130" y="692" class="monoSmall">*(.rodata*)</text>
  <text x="130" y="712" class="monoSmall">KEEP(*(.init)) KEEP(*(.fini))</text>
  <text x="130" y="732" class="monoSmall">KEEP(*(.ARM.exidx*))</text>
  <text x="108" y="762" class="mono">__etext = end of .text</text>
  <text x="108" y="784" class="monoSmall">LMA for app-domain .data starts here</text>

  <rect x="550" y="110" width="430" height="760" rx="8" class="frame"/>
  <text x="765" y="144" text-anchor="middle" class="heading">TASK_RAM (rw) - 64 KiB</text>
  <text x="578" y="174" class="mono">__rk_task_ram_begin = 0x20000000</text>
  <text x="578" y="194" class="mono">__rk_task_ram_end   = 0x20010000</text>

  <rect x="588" y="222" width="354" height="128" rx="6" class="app"/>
  <text x="765" y="248" text-anchor="middle" class="label">Implicit App domain - fixed 16 KiB window</text>
  <text x="608" y="274" class="mono">.rk_app_domain_data : AT(__etext)</text>
  <text x="628" y="294" class="monoSmall">app/src/*.o(.data* .sdata*)</text>
  <text x="628" y="312" class="monoSmall">app/examples/*.o(.data* .sdata*)</text>
  <text x="608" y="336" class="monoSmall">__rk_app_domain_begin, data_begin, data_end</text>

  <rect x="588" y="358" width="354" height="104" rx="6" class="app"/>
  <text x="608" y="386" class="mono">.rk_app_domain_bss (NOLOAD)</text>
  <text x="628" y="406" class="monoSmall">*(.rk_app_ram*)</text>
  <text x="628" y="424" class="monoSmall">app/src + app/examples .bss/.sbss/COMMON</text>
  <text x="608" y="448" class="monoSmall">ASSERT(app domain &lt;= 0x4000); end = begin + 0x4000</text>

  <rect x="588" y="486" width="354" height="82" rx="6" class="domain"/>
  <text x="608" y="514" class="mono">.rk_domain_ram (NOLOAD)</text>
  <text x="628" y="536" class="monoSmall">KEEP(*(.rk_domain_ram*))</text>
  <text x="628" y="554" class="monoSmall">*(.rk_task_ram*)</text>

  <rect x="588" y="582" width="354" height="62" rx="6" class="stack"/>
  <text x="608" y="608" class="mono">.rk_task_stack (NOLOAD)</text>
  <text x="628" y="630" class="monoSmall">ALIGN(32); KEEP(*(.rk_task_stack*))</text>

  <rect x="588" y="658" width="354" height="56" rx="6" class="stack"/>
  <text x="608" y="682" class="mono">.rk_task_noinit (NOLOAD)</text>
  <text x="628" y="704" class="monoSmall">*(.rk_task_noinit*); static task RAM end</text>

  <rect x="588" y="730" width="354" height="98" rx="6" class="shared"/>
  <text x="608" y="756" class="mono">.rk_shared_ram (NOLOAD) - fixed 1024 B</text>
  <text x="628" y="778" class="monoSmall">ALIGN(1024); __rk_shared_ram_begin</text>
  <text x="628" y="796" class="monoSmall">*(.rk_shared_bss*) *(.rk_shared_ram*)</text>
  <text x="628" y="814" class="monoSmall">*(.rk_shared_noinit*); ASSERT &lt;= 1024</text>

  <rect x="1080" y="110" width="370" height="760" rx="8" class="frame"/>
  <text x="1265" y="144" text-anchor="middle" class="heading">KERNEL_RAM (rwx) - 32 KiB</text>
  <text x="1108" y="174" class="mono">__rk_kernel_ram_begin = 0x20010000</text>
  <text x="1108" y="194" class="mono">__rk_kernel_ram_end   = 0x20018000</text>

  <rect x="1114" y="230" width="302" height="94" rx="6" class="kdata"/>
  <text x="1134" y="258" class="mono">.data : AT(app_data_load_end)</text>
  <text x="1154" y="280" class="monoSmall">*(.rk_kernel_data*)</text>
  <text x="1154" y="298" class="monoSmall">*(.data*)</text>
  <text x="1134" y="316" class="monoSmall">_sdata, _edata, _sidata = LOADADDR(.data)</text>

  <rect x="1114" y="344" width="302" height="82" rx="6" class="kernel"/>
  <text x="1134" y="372" class="mono">.bss</text>
  <text x="1154" y="394" class="monoSmall">*(.rk_kernel_bss*)</text>
  <text x="1154" y="412" class="monoSmall">*(.bss*) *(COMMON)</text>

  <rect x="1114" y="446" width="302" height="56" rx="6" class="kernel"/>
  <text x="1134" y="472" class="mono">.noinit (NOLOAD)</text>
  <text x="1154" y="492" class="monoSmall">*(.noinit)</text>

  <rect x="1114" y="522" width="302" height="104" rx="6" class="heap"/>
  <text x="1134" y="550" class="mono">._user_heap_stack</text>
  <text x="1154" y="572" class="monoSmall">PROVIDE(end), PROVIDE(_end)</text>
  <text x="1154" y="590" class="monoSmall">_Min_Heap_Size  = 0x100</text>
  <text x="1154" y="608" class="monoSmall">_Min_Stack_Size = 0x800</text>

  <rect x="1114" y="656" width="302" height="72" rx="6" class="kernel"/>
  <text x="1265" y="686" text-anchor="middle" class="label">MSP / privileged stack top</text>
  <text x="1265" y="710" text-anchor="middle" class="mono">__StackTop = _estack = 0x20018000</text>

  <rect x="1114" y="758" width="302" height="70" rx="6" class="discard"/>
  <text x="1134" y="786" class="mono">/DISCARD/</text>
  <text x="1154" y="808" class="monoSmall">libc.a(*) libm.a(*) libgcc.a(*)</text>

  <path d="M 248 762 C 350 900 582 910 620 350" class="copy"/>
  <text x="360" y="900" class="small">copy .rk_app_domain_data LMA from FLASH to TASK_RAM</text>

  <path d="M 320 784 C 720 940 1080 920 1136 320" class="copy"/>
  <text x="905" y="918" class="small">copy kernel .data LMA from FLASH to KERNEL_RAM</text>

  <path d="M 942 528 C 990 528 1032 278 1114 278" class="arrow"/>
  <text x="994" y="504" class="small">separate VMA ranges</text>

  <text x="750" y="940" text-anchor="middle" class="small">Placement is not unprivileged policy: it only supplies ranges; membership and installed MPU entries grant access.</text>
</svg>
