<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="617px" preserveAspectRatio="none" style="width:595px;height:617px;background:#FFFFFF;" version="1.1" viewBox="0 0 595 617" width="595px" zoomAndPan="magnify"><title>Contained unprivileged MPU fault</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="243.0518" x="174.5474" y="33.5352">Contained unprivileged MPU fault</text></g><ellipse cx="339.0942" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="358.4199" x="159.8843" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="338.4199" x="169.8843" y="109.0898">Task touches kernel RAM or foreign domain writable state</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="278.2109" x="199.9888" y="141.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258.2109" x="209.9888" y="163.2227">MemManage handler runs privileged on MSP</text><polygon fill="#F1F1F1" points="246.5664,195.7539,431.6221,195.7539,443.6221,207.7539,431.6221,219.7539,246.5664,219.7539,234.5664,207.7539,246.5664,195.7539" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.0557" x="246.5664" y="211.9111">fault came from unprivileged task?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="217.0835" y="205.4336">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="443.6221" y="205.4336">no</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.666" x="56.4746" y="229.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.666" x="66.4746" y="251.3555">capture PC, LR, PSP, CONTROL and MMFAR</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.1582" x="72.7285" y="283.8867"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.1582" x="82.7285" y="305.4883">print MPU TASK FAULT when enabled</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.5918" x="102.5117" y="338.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.5918" x="112.5117" y="359.6211">mark task FAULT_PENDING</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="305.6152" x="38" y="392.1523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="285.6152" x="48" y="413.7539">PendSV switches away without saving faulted PSP</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="359.6152" x="11" y="446.2852"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="339.6152" x="21" y="467.8867">PostProc unlinks waits and releases task-owned resources</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="161.2227" x="110.1963" y="500.418"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.2227" x="120.1963" y="522.0195">surviving tasks continue</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;st